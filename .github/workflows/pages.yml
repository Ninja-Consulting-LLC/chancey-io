name: website

on:
  pull_request:
    paths-ignore:
      - 'server/**'
      - '.github/workflows/contact-worker.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - '.github/workflows/contact-worker.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          # Public, safe to embed — Google enforces the per-domain allow-list on this key.
          PUBLIC_RECAPTCHA_SITE_KEY: 6LfKYdIsAAAAAG2exCOEtxpj5PSOfAnEOUw-xJ2F
          # Set this in the repo's Variables (Settings → Secrets and variables → Actions → Variables)
          # once the Worker is deployed. Falls back to the production workers.dev URL.
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT || 'https://chancey-contact.workers.dev' }}
        run: npm run build
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    name: deploy
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
