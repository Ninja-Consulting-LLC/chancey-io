name: admin

on:
  push:
    branches: [main]
    paths-ignore:
      - 'server/**'
      - '.github/workflows/contact-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-admin:
    name: Deploy admin.chancey.io
    runs-on: ubuntu-latest
    environment:
      name: admin
      url: https://admin.chancey.io/admin/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build admin site
        env:
          SITE_URL: https://admin.chancey.io
          PUBLIC_NOINDEX: '1'
          PUBLIC_CHANCEY_APP_URL: https://app.chancey.io
          PUBLIC_CHANCEY_API_BASE_URL: https://chancey-api.ninjaconsultingllc.workers.dev
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.REACT_APP_CLERK_PUBLISHABLE_KEY_PROD }}
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT || 'https://chancey-contact.ninjaconsultingllc.workers.dev' }}
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create chancey-admin \
            --production-branch=main 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if npx --yes wrangler@4 pages deploy dist \
              --project-name=chancey-admin \
              --branch=main \
              --commit-dirty=true 2>&1 | tee deploy.out; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Cloudflare Pages deploy failed; retrying in $((attempt * 20))s..."
            sleep $((attempt * 20))
          done
