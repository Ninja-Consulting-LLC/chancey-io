name: staging

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Site-only PRs get a staging deploy. The contact worker has its own
    # workflow; pure worker PRs don't need a site staging build.
    paths-ignore:
      - 'server/**'
      - '.github/workflows/contact-worker.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy staging.chancey.io
    # Skip PRs from forks: they can't (and shouldn't) use deploy secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.chancey.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (staging)
        env:
          SITE_URL: https://staging.chancey.io
          # Keep the whole staging environment out of search engines.
          PUBLIC_NOINDEX: '1'
          # Public, per-domain-scoped reCAPTCHA site key (safe to embed).
          PUBLIC_RECAPTCHA_SITE_KEY: 6LfKYdIsAAAAAG2exCOEtxpj5PSOfAnEOUw-xJ2F
          # Reuse the deployed contact worker; override via repo variable.
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT || 'https://chancey-contact.ninjaconsultingllc.workers.dev' }}
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create chancey-staging \
            --production-branch=staging 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Deploy to the project's production branch so the custom domain
          # (staging.chancey.io) always serves the latest PR build. Wrangler
          # also prints a unique per-deploy *.pages.dev preview URL.
          out=$(npx --yes wrangler@4 pages deploy dist \
            --project-name=chancey-staging \
            --branch=staging \
            --commit-dirty=true 2>&1)
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9-]+\.chancey-staging\.pages\.dev' | head -1)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment staging URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const preview = '${{ steps.deploy.outputs.preview_url }}';
            const body = [
              '### Staging deploy ✅',
              '',
              '- **Staging site:** https://staging.chancey.io',
              preview ? `- **This build:** ${preview}` : '',
              '',
              '_Noindexed. staging.chancey.io reflects the most recently deployed PR._',
            ].filter(Boolean).join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '### Staging deploy';
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
