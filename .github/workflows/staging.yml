name: staging

# Push-triggered, not pull_request: a staging/preview deploy must work even
# when the PR has merge conflicts with main (GitHub can't build the
# pull_request merge-ref then and skips pull_request workflows entirely).
# main is excluded (that's production, via pages.yml).
on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - 'server/**'
      - '.github/workflows/contact-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy staging.chancey.io
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.chancey.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (staging)
        env:
          SITE_URL: https://staging.chancey.io
          # Keep the whole staging environment out of search engines.
          PUBLIC_NOINDEX: '1'
          # Public, per-domain-scoped reCAPTCHA site key (safe to embed).
          PUBLIC_RECAPTCHA_SITE_KEY: 6LfKYdIsAAAAAG2exCOEtxpj5PSOfAnEOUw-xJ2F
          # Reuse the deployed contact worker; override via repo variable.
          PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT || 'https://chancey-contact.ninjaconsultingllc.workers.dev' }}
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create chancey-staging \
            --production-branch=staging 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Stream wrangler output (don't capture in $() under set -e, which
          # swallows the real error). pipefail makes a deploy failure fail
          # the step with the actual message visible in the log.
          set -o pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name=chancey-staging \
            --branch=staging \
            --commit-dirty=true 2>&1 | tee deploy.out
          url=$(grep -oE 'https://[a-z0-9-]+\.chancey-staging\.pages\.dev' deploy.out | head -1)
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment staging URL on the PR (if one is open)
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open',
            });
            if (prs.length === 0) {
              core.info(`No open PR for ${branch}; skipping comment.`);
              return;
            }
            const preview = '${{ steps.deploy.outputs.preview_url }}';
            const body = [
              '### Staging deploy ✅',
              '',
              '- **Staging site:** https://staging.chancey.io',
              preview ? `- **This build:** ${preview}` : '',
              '',
              '_Noindexed. staging.chancey.io reflects the most recently deployed branch._',
            ].filter(Boolean).join('\n');
            const marker = '### Staging deploy';
            for (const pr of prs) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
              });
              const existing = comments.find((c) => c.body && c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }
