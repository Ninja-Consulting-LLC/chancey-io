<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6ec"/>
      <stop offset="1" stop-color="#ffe6cd"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b3d"/>
      <stop offset="1" stop-color="#f5b82e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#ff6b3d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="ballShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b1410" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand mark -->
  <g transform="translate(80, 80)">
    <rect width="68" height="68" rx="20" fill="url(#accent)"/>
    <text x="34" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="700" fill="white">C</text>
  </g>
  <text x="170" y="125" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#1b1410" letter-spacing="-0.5">Chancey</text>

  <!-- Headline (loss-fear) -->
  <text x="80" y="285" font-family="Georgia, serif" font-size="88" font-weight="600" fill="#1b1410" letter-spacing="-2.5">Never wonder</text>
  <text x="80" y="385" font-family="Georgia, serif" font-size="88" font-weight="600" fill="#1b1410" letter-spacing="-2.5">if you won.</text>
  <text x="80" y="470" font-family="Georgia, serif" font-size="40" font-weight="600" fill="#5a4a3f" letter-spacing="-1">Scan it. Chancey checks every draw.</text>

  <!-- Subline -->
  <text x="80" y="558" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="22" fill="#5a4a3f">Scan tickets · Auto-check every draw · No ads</text>

  <!-- Lottery balls cluster -->
  <g transform="translate(820, 200)" filter="url(#ballShadow)">
    <circle cx="60" cy="60" r="58" fill="#f5b82e"/>
    <text x="60" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="#1b1410">04</text>

    <circle cx="190" cy="40" r="58" fill="#f5b82e"/>
    <text x="190" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="#1b1410">22</text>

    <circle cx="320" cy="80" r="58" fill="white"/>
    <text x="320" y="94" text-anchor="middle" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="#1b1410">31</text>

    <circle cx="100" cy="190" r="58" fill="#f5b82e"/>
    <text x="100" y="204" text-anchor="middle" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="#1b1410">47</text>

    <circle cx="240" cy="220" r="58" fill="white"/>
    <text x="240" y="234" text-anchor="middle" font-family="Inter, sans-serif" font-size="40" font-weight="800" fill="#1b1410">58</text>

    <circle cx="370" cy="190" r="58" fill="#1f9d5f"/>
    <text x="370" y="204" text-anchor="middle" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="white">WIN</text>
  </g>

  <!-- Tagline pill -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="360" height="36" rx="18" fill="#1b1410"/>
    <text x="180" y="24" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#fff6ec" letter-spacing="2">LOTTERY TICKET TRACKER · 18+</text>
  </g>
</svg>
